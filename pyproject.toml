[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelhub-kit"
version = "0.1.0"
description = "Conservative cross-platform coding-tool and model-catalog maintenance"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
modelhub-kit = "modelhub_kit.__main__:cli"

[tool.setuptools.package-data]
modelhub_kit = ["tools.json"]

[tool.setuptools.packages.find]
include = ["modelhub_kit*"]
